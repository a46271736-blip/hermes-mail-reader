<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Mail Reader</title>
</head>
<body>
  <main>
    <h1>Hermes Mail Reader</h1>

    <p>
      個人用のGmail読み取り・要約ツールです。
      Gmail APIを使ってメールを確認し、
      アカウント所有者向けの日次要約を作成します。
    </p>

    <h2>Googleデータの利用目的</h2>
    <p>
      Gmailのデータは、所有者のメールの整理・要約に使用します。
      一般向けに提供するサービスではありません。
    </p>

    <h2>アクセス権限</h2>
    <p>
      Gmailの読み取り専用権限
      （https://www.googleapis.com/auth/gmail.readonly）
      を使用します。
      この権限ではメールの送信・削除・変更はできません。
    </p>

    <p><a href="./privacy.html">プライバシーポリシー</a></p>
  </main>
</body>
</html>
